<template>
    <div class="slds-form-element">
        <span class="slds-form-element__label">{label}</span>
        <div class="slds-form-element__control slds-is-relative">
            <button
                type="button"
                class="slds-input_faux c-trigger"
                aria-haspopup="listbox"
                aria-expanded={isOpen}
                onclick={handleToggle}>
                <span class="slds-truncate">{selectedLabel}</span>
            </button>
            <lightning-button-icon
                lwc:if={canClear}
                class="c-clear"
                icon-name="utility:clear"
                variant="bare"
                size="small"
                alternative-text="Clear selection"
                title="Clear selection"
                onclick={handleClear}>
            </lightning-button-icon>

            <div lwc:if={isOpen} class="slds-dropdown slds-dropdown_fluid slds-dropdown_left c-menu">
                <div class="slds-p-around_x-small">
                    <lightning-input
                        lwc:ref="search"
                        type="search"
                        label="Search options"
                        variant="label-hidden"
                        placeholder="Search..."
                        onchange={handleSearch}>
                    </lightning-input>
                </div>
                <ul class="slds-listbox slds-listbox_vertical" role="listbox">
                    <template for:each={groups} for:item="group">
                        <li key={group.key} role="presentation">
                            <h3 lwc:if={group.label} class="slds-listbox__option-header">{group.label}</h3>
                            <ul>
                                <template for:each={group.options} for:item="option">
                                    <li key={option.value} role="presentation" class="slds-listbox__item">
                                        <div
                                            class={option.className}
                                            role="option"
                                            aria-selected={option.isSelected}
                                            data-value={option.value}
                                            onclick={handleSelect}>
                                            <span class="slds-truncate">{option.label}</span>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </li>
                    </template>
                    <li lwc:if={hasNoResults} role="presentation" class="slds-p-around_small slds-text-color_weak">
                        No matching options
                    </li>
                </ul>
            </div>
        </div>
    </div>
</template>
